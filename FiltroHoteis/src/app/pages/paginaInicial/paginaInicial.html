<div class="pagina-busca">

  <section class="grid grid-1">
  </section>

  <section class="grid grid-2">

    <div class="menu-produtos">

      <div class="menu-item">
        <img src="http://files.rdcviagens.com.br/MenuProdutosPortal/hospedagem.svg" alt="Hospedagens"
          class="grayFilter">
        <div class="label">Hospedagens</div>
      </div>

      <div class="menu-item">
        <img src="http://files.rdcviagens.com.br/MenuProdutosPortal/aereo.svg" alt="Passagens" class="grayFilter">
        <div class="label">Passagens</div>
      </div>

      <div class="menu-item">
        <img src="http://files.rdcviagens.com.br/MenuProdutosPortal/carros.svg" alt="Carros" class="grayFilter">
        <div class="label">Carros</div>
      </div>

      <div class="menu-item">
        <img src="http://files.rdcviagens.com.br/MenuProdutosPortal/monte_viagem.svg" alt="Monte sua Viagem"
          class="grayFilter">
        <div class="label">
          Monte sua<br>Viagem
        </div>
      </div>

      <div class="menu-item">
        <img src="http://files.rdcviagens.com.br/MenuProdutosPortal/cruzeiros.svg" alt="Cruzeiros" class="grayFilter">
        <div class="label">Cruzeiros</div>
      </div>

      <div class="menu-item">
        <img src="http://files.rdcviagens.com.br/MenuProdutosPortal/onibus.svg" alt="Passagens de ônibus"
          class="grayFilter">
        <div class="label">
          Passagens<br>de ônibus
        </div>
      </div>

      <div class="menu-item">
        <img src="http://files.rdcviagens.com.br/MenuProdutosPortal/ingressos.svg" alt="Ingressos" class="grayFilter">
        <div class="label">Ingressos</div>
      </div>

      <div class="menu-item">
        <img src="http://files.rdcviagens.com.br/MenuProdutosPortal/traslados.svg" alt="Traslados" class="grayFilter">
        <div class="label">Traslados</div>
      </div>

      <div class="menu-item">
        <img src="http://files.rdcviagens.com.br/MenuProdutosPortal/seguro_viagem.svg" alt="Seguro Viagem"
          class="grayFilter">
        <div class="label">
          Seguro<br>Viagem
        </div>
      </div>

    </div>

  </section>

  <section class="grid grid-3">

    <h3 class="titulo">
      Buscar hospedagens
    </h3>

    <div class="busca-hoteis">

      <!-- Busca de hotéis -->
      <div class="campo-busca">
        <app-buscar-hoteis (hotelSelecionado)="receberHotel($event)"></app-buscar-hoteis>
      </div>

      <!-- Busca de datas -->
      <div class="campo-busca">
        <app-calendario (datasSelecionadas)="receberDatas($event)"></app-calendario>
      </div>

      <!-- Busca de hóspedes -->
      <div class="campo-busca">
        <app-hospedes (hospedesSelecionados)="receberHospedes($event)"></app-hospedes>
      </div>

      <!-- Botão buscar -->
      <div class="botao-buscar" (click)="buscar()">
        <img src="imagens/procurar.png" alt="Buscar">
      </div>

    </div>

  </section>

  <section class="grid grid-4">
  </section>

</div>
