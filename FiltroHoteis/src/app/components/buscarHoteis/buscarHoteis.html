<div class="busca-hoteis">

  <div class="campo-conteudo">

    <label>
      Para onde deseja ir?
    </label>

    <input
      type="text"
      [(ngModel)]="textoBusca"
      [placeholder]="destinoSelecionado ? 'Digite pelo menos 3 letras' : ''"
      (focus)="destinoSelecionado = true"
      (input)="buscarHotel()"
      (blur)="destinoSelecionado = false"
      autocomplete="off"
    >

    <div
      class="lista-hoteis"
      *ngIf="
        destinoSelecionado &&
        hoteisFiltrados.length > 0
      "
    >

      <div
        class="hotel-opcao"
        *ngFor="let hotel of hoteisFiltrados"
        (mousedown)="selecionarHotel(hotel)"
      >
        {{ hotel.NOME }}
      </div>

    </div>

  </div>

</div>
