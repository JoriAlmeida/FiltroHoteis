<div class="calendario-wrapper" (click)="$event.stopPropagation()">


  <div class="campo-calendario" [class.campo-aberto]="aberto || dataEntrada" (click)="abrir()">

    <div class="icone-calendario">

      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#5f6368">
        <path
          d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Zm280 240q-17 0-28.5-11.5T440-440q0-17 11.5-28.5T480-480q17 0 28.5 11.5T520-440q0 17-11.5 28.5T480-400Zm-160 0q-17 0-28.5-11.5T280-440q0-17 11.5-28.5T320-480q17 0 28.5 11.5T360-440q0 17-11.5 28.5T320-400Zm320 0q-17-17 0-34t34 0q17 17 0 34t-34 0ZM480-240q-17 0-28.5-11.5T440-280q0-17 11.5-28.5T480-320q17 0 28.5 11.5T520-280q0 17-11.5 28.5T480-240Zm-160 0q-17 0-28.5-11.5T280-280q0-17 11.5-28.5T320-320q17 0 28.5 11.5T360-280q0 17-11.5 28.5T320-240Zm320 0q-17 0-28.5-11.5T600-280q0-17 11.5-28.5T640-320q17 0 28.5 11.5T680-280q0 17-11.5 28.5T640-240Z" />
      </svg>

    </div>

    <div class="campo-conteudo">

      <label>Quando?</label>

      <input type="text" [value]="dataEntrada ? textoDatas() : ''" [placeholder]="aberto ? 'Selecione as datas...' : ''"
        readonly>

    </div>

  </div>


  <div class="calendario-container" *ngIf="aberto" (click)="$event.stopPropagation()">

    <!-- MÊS ATUAL -->
    <div class="calendarios">

      <div class="calendar">

        <header>

          <span>
            {{ nomeMes(mesAtual) }} · {{ mesAtual.getFullYear() }}
          </span>

        </header>

        <div class="days-of-week">
          <div>Dom</div>
          <div>Seg</div>
          <div>Ter</div>
          <div>Qua</div>
          <div>Qui</div>
          <div>Sex</div>
          <div>Sáb</div>
        </div>

        <div class="days">

          <div class="day-container" *ngFor="let dia of diasMesAtual">

            <div class="day-container__item" [class.void-day]="dia.numero === null" [class.past-day]="dia.passado"
              [class.day-selected]="dia.data && dataSelecionadaInicio(dia.data)"
              [class.day-end]="dia.data && dataSelecionadaFim(dia.data)"
              [class.day-range]="dia.data && dataDentroDoPeriodo(dia.data)"
              (click)="dia.data && selecionarData(dia.data)">

              <span *ngIf="dia.numero !== null">
                {{ dia.numero }}

                <span *ngIf="dia.passado" class="traco-dia"></span>
              </span>

            </div>

          </div>

        </div>

      </div>


      <!-- MÊS SEGUINTE -->

      <div class="calendar">

        <header>

          <span>
            {{ nomeMes(mesSeguinte) }} · {{ mesSeguinte.getFullYear() }}
          </span>

          <button type="button" class="right" (click)="mesProximo()">
            ›
          </button>

        </header>

        <div class="days-of-week">
          <div>Dom</div>
          <div>Seg</div>
          <div>Ter</div>
          <div>Qua</div>
          <div>Qui</div>
          <div>Sex</div>
          <div>Sáb</div>
        </div>

        <div class="days">

          <div class="day-container" *ngFor="let dia of diasMesSeguinte">

            <div class="day-container__item" [class.void-day]="dia.numero === null" [class.past-day]="dia.passado"
              [class.day-selected]="dia.data && dataSelecionadaInicio(dia.data)"
              [class.day-end]="dia.data && dataSelecionadaFim(dia.data)"
              [class.day-range]="dia.data && dataDentroDoPeriodo(dia.data)"
              (click)="dia.data && selecionarData(dia.data)">

              <span *ngIf="dia.numero !== null">
                {{ dia.numero }}

                <span *ngIf="dia.passado" class="traco-dia"></span>
              </span>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
