      {{ hotel?.NOME }}
    </div>

  </div>


  <div class="datas-pesquisa">
    <div class="data-item">

      <div class="valor-campo">
        {{ dataEntrada | date:'dd/MM/yyyy' }}
      </div>

    </div>


    <div class="data-item">

      <div class="valor-campo">
        {{ dataSaida | date:'dd/MM/yyyy' }}
      </div>

    </div>

  </div>


  <div class="informacao-pesquisa">

    <div class="valor-campo"> 
      {{ totalAdultos }} adultos · {{ totalCriancas }} crianças · {{ quartos.length }} quarto(s) 
    </div>


    <button type="button" class="nova-pesquisa">
      Nova pesquisa
    </button>

  </div>
